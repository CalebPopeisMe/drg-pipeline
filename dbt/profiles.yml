drg_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../../warehouse/drg.duckdb
      extensions: [httpfs]
      settings:
        s3_endpoint: "{{ env_var('MINIO_HOST_PORT', 'localhost:9000') }}"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin123"
        s3_use_ssl: false
        s3_url_style: "path"